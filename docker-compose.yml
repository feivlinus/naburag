services:
  app:
    image: oven/bun:1.4.4
    container_name: local-rag-app
    restart: unless-stopped
    command: sleep infinity
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: bge-m3
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: llama3.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      qdrant:
        condition: service_started
      # Only the Ollama service of the active COMPOSE_PROFILES exists; the others are skipped.
      ollama-nvidia:
        condition: service_started
        required: false
      ollama-rocm:
        condition: service_started
        required: false
      ollama-cpu:
        condition: service_started
        required: false

  # Hardware Acceleration Profile: NVIDIA GPU (CUDA + FlashAttention)
  ollama-nvidia:
    image: ollama/ollama:0.40.4
    container_name: local-rag-ollama-nvidia
    profiles: ["nvidia"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped

  # Hardware Acceleration Profile: AMD GPU (ROCm)
  ollama-rocm:
    image: ollama/ollama:0.40.4-rocm
    container_name: local-rag-ollama-rocm
    profiles: ["amd", "rocm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped

  # Hardware Acceleration Profile: CPU Fallback
  ollama-cpu:
    image: ollama/ollama:0.40.4
    container_name: local-rag-ollama-cpu
    profiles: ["cpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: local-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: local-rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
  ollama_data:
