name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ragpassword
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: bun install --frozen-lockfile --cwd web

      - name: Type check (Backend & Shared)
        run: bun x tsc --noEmit

      - name: Type check & build (Web Frontend)
        run: bun run --cwd web build

      - name: Run test suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ragpassword
          POSTGRES_DB: ragdb
          QDRANT_URL: http://localhost:6333
        run: bun test
